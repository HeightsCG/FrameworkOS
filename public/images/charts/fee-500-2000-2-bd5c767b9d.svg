<svg class="sx-chart" viewBox="0 0 304 260" width="304" height="260" role="img" aria-labelledby="sxc_t sxc_d" xmlns="http://www.w3.org/2000/svg" style="font-family:Inter,Helvetica,Arial,sans-serif"><title id="sxc_t">What you keep after the platform fee and plan price</title><line x1="64" y1="155" x2="288" y2="155" stroke="#e4e4e7" stroke-width="1"/><text x="56" y="159" text-anchor="end" font-size="11" fill="#71717a">$450</text><line x1="64" y1="110" x2="288" y2="110" stroke="#e4e4e7" stroke-width="1"/><text x="56" y="114" text-anchor="end" font-size="11" fill="#71717a">$900</text><line x1="64" y1="65" x2="288" y2="65" stroke="#e4e4e7" stroke-width="1"/><text x="56" y="69" text-anchor="end" font-size="11" fill="#71717a">$1,300</text><line x1="64" y1="20" x2="288" y2="20" stroke="#e4e4e7" stroke-width="1"/><text x="56" y="24" text-anchor="end" font-size="11" fill="#71717a">$1,750</text><line x1="64" y1="200" x2="288" y2="200" stroke="#a1a1aa" stroke-width="1"/><rect x="84" y="158.8" width="28" height="41.2" fill="#CD4C00" rx="3"><title>Creator Link Studio Creator (10% + $49/mo): you keep $401 of $500</title></rect><text x="98" y="154.8" text-anchor="middle" font-size="10" fill="#27272a">$401</text><rect x="120" y="170.6" width="28" height="29.4" fill="#FF6A13" rx="3"><title>Creator Link Studio Studio (3% + $199/mo): you keep $286 of $500</title></rect><text x="134" y="166.6" text-anchor="middle" font-size="10" fill="#27272a">$286</text><text x="116" y="218" text-anchor="middle" font-size="12" fill="#27272a">on $500 of sales</text><rect x="196" y="20" width="28" height="180" fill="#CD4C00" rx="3"><title>Creator Link Studio Creator (10% + $49/mo): you keep $1,751 of $2,000</title></rect><text x="210" y="16" text-anchor="middle" font-size="10" fill="#27272a">$1,751</text><rect x="232" y="21" width="28" height="179" fill="#FF6A13" rx="3"><title>Creator Link Studio Studio (3% + $199/mo): you keep $1,741 of $2,000</title></rect><text x="246" y="17" text-anchor="middle" font-size="10" fill="#27272a">$1,741</text><text x="228" y="218" text-anchor="middle" font-size="12" fill="#27272a">on $2,000 of sales</text><desc id="sxc_d">On $500 of sales you keep: Creator Link Studio Creator (10% + $49/mo) $401; Creator Link Studio Studio (3% + $199/mo) $286. On $2,000 of sales you keep: Creator Link Studio Creator (10% + $49/mo) $1,751; Creator Link Studio Studio (3% + $199/mo) $1,741.</desc></svg>