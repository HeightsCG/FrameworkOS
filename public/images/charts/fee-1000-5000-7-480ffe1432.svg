 y="278" width="35" height="54" fill="#d8d8dc" rx="4"><title>Patreon (pages published after August 4, 2025): you keep $900 of $1,000</title></rect><text x="345" y="270" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5">$900</text><rect x="372.5" y="275" width="35" height="57" fill="#d8d8dc" rx="4"><title>Ko-fi Free (memberships, shop, commissions): you keep $950 of $1,000</title></rect><text x="390" y="267" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5">$950</text><rect x="417.5" y="272" width="35" height="60" fill="#d8d8dc" rx="4"><title>Stan Store Creator ($29/mo, no transaction fee): you keep $1,000 of $1,000</title></rect><text x="435" y="264" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5">$1,000</text><text x="300" y="358" text-anchor="middle" font-size="13" fill="#f4f4f5">on $1,000 of sales</text><rect x="571.5" y="62" width="35" height="270" fill="#CD4C00" rx="4"><title>Creator Link Studio Creator (10%): you keep $4,500 of $5,000</title></rect><text x="589" y="54" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5">$4,500</text><rect x="616.5" y="41" width="35" height="291" fill="#FF6A13" rx="4"><title>Creator Link Studio Studio (3%): you keep $4,850 of $5,000</title></rect><text x="634" y="33" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5">$4,850</text><rect x="661.5" y="92" width="35" height="240" fill="#b8b8c0" rx="4"><title>OnlyFans: you keep $4,000 of $5,000</title></rect><text x="679" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5">$4,000</text><rect x="706.5" y="92" width="35" height="240" fill="#d8d8dc" rx="4"><title>Fansly: you keep $4,000 of $5,000</title></rect><text x="724" y="84" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5">$4,000</text><rect x="751.5" y="62" width="35" height="270" fill="#d8d8dc" rx="4"><title>Patreon (pages published after August 4, 2025): you keep $4,500 of $5,000</title></rect><text x="769" y="54" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5">$4,500</text><rect x="796.5" y="47" width="35" height="285" fill="#d8d8dc" rx="4"><title>Ko-fi Free (memberships, shop, commissions): you keep $4,750 of $5,000</title></rect><text x="814" y="39" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5">$4,750</text><rect x="841.5" y="32" width="35" height="300" fill="#d8d8dc" rx="4"><title>Stan Store Creator ($29/mo, no transaction fee): you keep $5,000 of $5,000</title></rect><text x="859" y="24" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5">$5,000</text><text x="724" y="358" text-anchor="middle" font-size="13" fill="#f4f4f5">on $5,000 of sales</text><desc id="sxc_d">On $1,000 of sales you keep: Creator Link Studio Creator (10%) $900; Creator Link Studio Studio (3%) $970; OnlyFans $800; Fansly $800; Patreon (pages published after August 4, 2025) $900; Ko-fi Free (memberships, shop, commissions) $950; Stan Store Creator ($29/mo, no transaction fee) $1,000. On $5,000 of sales you keep: Creator Link Studio Creator (10%) $4,500; Creator Link Studio Studio (3%) $4,850; OnlyFans $4,000; Fansly $4,000; Patreon (pages published after August 4, 2025) $4,500; Ko-fi Free (memberships, shop, commissions) $4,750; Stan Store Creator ($29/mo, no transaction fee) $5,000.</desc></svg>