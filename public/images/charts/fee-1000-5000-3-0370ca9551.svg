<svg class="sx-chart" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="sxc_t sxc_d" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif"><title id="sxc_t">What you keep after the platform fee</title><rect x="0" y="0" width="960" height="400" rx="12" fill="#161618"/><line x1="88" y1="257" x2="936" y2="257" stroke="#2a2a2e" stroke-width="1"/><text x="76" y="261" text-anchor="end" font-size="12" fill="#8e8e94">$1,200</text><line x1="88" y1="182" x2="936" y2="182" stroke="#2a2a2e" stroke-width="1"/><text x="76" y="186" text-anchor="end" font-size="12" fill="#8e8e94">$2,450</text><line x1="88" y1="107" x2="936" y2="107" stroke="#2a2a2e" stroke-width="1"/><text x="76" y="111" text-anchor="end" font-size="12" fill="#8e8e94">$3,650</text><line x1="88" y1="32" x2="936" y2="32" stroke="#2a2a2e" stroke-width="1"/><text x="76" y="36" text-anchor="end" font-size="12" fill="#8e8e94">$4,850</text><line x1="88" y1="332" x2="936" y2="332" stroke="#3a3a40" stroke-width="1"/><rect x="182" y="276.3" width="72" height="55.7" fill="#CD4C00" rx="4"><title>Creator Link Studio Creator (10%): you keep $900 of $1,000</title></rect><text x="218" y="268.3" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5">$900</text><rect x="264" y="272" width="72" height="60" fill="#FF6A13" rx="4"><title>Creator Link Studio Studio (3%): you keep $970 of $1,000</title></rect><text x="300" y="264" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5">$970</text><rect x="346" y="273.2" width="72" height="58.8" fill="#b8b8c0" rx="4"><title>Ko-fi Free (memberships, shop, commissions): you keep $950 of $1,000</title></rect><text x="382" y="265.2" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5">$950</text><text x="300" y="358" text-anchor="middle" font-size="13" fill="#f4f4f5">on $1,000 of sales</text><rect x="606" y="53.6" width="72" height="278.4" fill="#CD4C00" rx="4"><title>Creator Link Studio Creator (10%): you keep $4,500 of $5,000</title></rect><text x="642" y="45.6" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5">$4,500</text><rect x="688" y="32" width="72" height="300" fill="#FF6A13" rx="4"><title>Creator Link Studio Studio (3%): you keep $4,850 of $5,000</title></rect><text x="724" y="24" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5">$4,850</text><rect x="770" y="38.2" width="72" height="293.8" fill="#b8b8c0" rx="4"><title>Ko-fi Free (memberships, shop, commissions): you keep $4,750 of $5,000</title></rect><text x="806" y="30.2" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5">$4,750</text><text x="724" y="358" text-anchor="middle" font-size="13" fill="#f4f4f5">on $5,000 of sales</text><desc id="sxc_d">On $1,000 of sales you keep: Creator Link Studio Creator (10%) $900; Creator Link Studio Studio (3%) $970; Ko-fi Free (memberships, shop, commissions) $950. On $5,000 of sales you keep: Creator Link Studio Creator (10%) $4,500; Creator Link Studio Studio (3%) $4,850; Ko-fi Free (memberships, shop, commissions) $4,750.</desc></svg>