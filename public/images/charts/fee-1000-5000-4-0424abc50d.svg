<?xml version="1.0" encoding="UTF-8"?>
<svg class="sx-chart" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="sxc_t sxc_d" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif"><title id="sxc_t">What you keep after the platform fee</title><rect x="0" y="0" width="960" height="400" rx="12" fill="#161618"/><line x1="88" y1="257" x2="936" y2="257" stroke="#2a2a2e" stroke-width="1"/><text x="76" y="261" text-anchor="end" font-size="12" fill="#8e8e94">$1,250</text><line x1="88" y1="182" x2="936" y2="182" stroke="#2a2a2e" stroke-width="1"/><text x="76" y="186" text-anchor="end" font-size="12" fill="#8e8e94">$2,500</text><line x1="88" y1="107" x2="936" y2="107" stroke="#2a2a2e" stroke-width="1"/><text x="76" y="111" text-anchor="end" font-size="12" fill="#8e8e94">$3,750</text><line x1="88" y1="32" x2="936" y2="32" stroke="#2a2a2e" stroke-width="1"/><text x="76" y="36" text-anchor="end" font-size="12" fill="#8e8e94">$5,000</text><line x1="88" y1="332" x2="936" y2="332" stroke="#3a3a40" stroke-width="1"/><rect x="149" y="278" width="68" height="54" fill="#CD4C00" rx="4"><title>Creator Link Studio Creator (10%): you keep $900 of $1,000</title></rect><text x="183" y="270" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5">$900</text><rect x="227" y="273.8" width="68" height="58.2" fill="#FF6A13" rx="4"><title>Creator Link Studio Studio (3%): you keep $970 of $1,000</title></rect><text x="261" y="265.8" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5">$970</text><rect x="305" y="279.2" width="68" height="52.8" fill="#b8b8c0" rx="4"><title>Linktree Free (12% on sales): you keep $880 of $1,000</title></rect><text x="339" y="271.2" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5">$880</text><rect x="383" y="272" width="68" height="60" fill="#d8d8dc" rx="4"><title>Linktree Premium ($35/mo, 0% on sales): you keep $1,000 of $1,000</title></rect><text x="417" y="264" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5">$1,000</text><text x="300" y="358" text-anchor="middle" font-size="13" fill="#f4f4f5">on $1,000 of sales</text><rect x="573" y="62" width="68" height="270" fill="#CD4C00" rx="4"><title>Creator Link Studio Creator (10%): you keep $4,500 of $5,000</title></rect><text x="607" y="54" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5">$4,500</text><rect x="651" y="41" width="68" height="291" fill="#FF6A13" rx="4"><title>Creator Link Studio Studio (3%): you keep $4,850 of $5,000</title></rect><text x="685" y="33" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5">$4,850</text><rect x="729" y="68" width="68" height="264" fill="#b8b8c0" rx="4"><title>Linktree Free (12% on sales): you keep $4,400 of $5,000</title></rect><text x="763" y="60" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5">$4,400</text><rect x="807" y="32" width="68" height="300" fill="#d8d8dc" rx="4"><title>Linktree Premium ($35/mo, 0% on sales): you keep $5,000 of $5,000</title></rect><text x="841" y="24" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5">$5,000</text><text x="724" y="358" text-anchor="middle" font-size="13" fill="#f4f4f5">on $5,000 of sales</text><desc id="sxc_d">On $1,000 of sales you keep: Creator Link Studio Creator (10%) $900; Creator Link Studio Studio (3%) $970; Linktree Free (12% on sales) $880; Linktree Premium ($35/mo, 0% on sales) $1,000. On $5,000 of sales you keep: Creator Link Studio Creator (10%) $4,500; Creator Link Studio Studio (3%) $4,850; Linktree Free (12% on sales) $4,400; Linktree Premium ($35/mo, 0% on sales) $5,000.</desc></svg>