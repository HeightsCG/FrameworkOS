of $2,000</title></rect><text x="765" y="24" text-anchor="middle" font-size="12" font-weight="600" fill="#f4f4f5">$1,940</text><text x="724" y="358" text-anchor="middle" font-size="13" fill="#f4f4f5">on $2,000 of sales</text><desc id="sxc_d">On $500 of sales you keep: Creator Link Studio Creator (10%) $450; Creator Link Studio Studio (3%) $485. On $2,000 of sales you keep: Creator Link Studio Creator (10%) $1,800; Creator Link Studio Studio (3%) $1,940.</desc></svg>