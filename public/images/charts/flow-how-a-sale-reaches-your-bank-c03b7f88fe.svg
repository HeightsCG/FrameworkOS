<?xml version="1.0" encoding="UTF-8"?>
<svg class="sx-flow" viewBox="0 0 724 70" width="724" height="70" role="img" aria-labelledby="sxf_t sxf_d" xmlns="http://www.w3.org/2000/svg" style="font-family:Inter,Helvetica,Arial,sans-serif"><title id="sxf_t">How a sale reaches your bank</title><desc id="sxf_d">A fan buys on your page, then The sale lands in your balance, net of the plan fee, then You cash out on request, then The payout reaches your bank.</desc><defs><marker id="sxf_arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a1a1aa"/></marker></defs><rect x="8" y="8" width="150" height="54" rx="6" fill="#ffffff" stroke="#d4d4d8"/><text x="83" y="31.5" text-anchor="middle" font-size="12" fill="#27272a">A fan buys on your</text><text x="83" y="46.5" text-anchor="middle" font-size="12" fill="#27272a">page</text><line x1="162" y1="35" x2="190" y2="35" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#sxf_arrow)"/><rect x="194" y="8" width="150" height="54" rx="6" fill="#ffffff" stroke="#d4d4d8"/><text x="269" y="24" text-anchor="middle" font-size="12" fill="#27272a">The sale lands in</text><text x="269" y="39" text-anchor="middle" font-size="12" fill="#27272a">your balance, net of</text><text x="269" y="54" text-anchor="middle" font-size="12" fill="#27272a">the plan fee</text><line x1="348" y1="35" x2="376" y2="35" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#sxf_arrow)"/><rect x="380" y="8" width="150" height="54" rx="6" fill="#ffffff" stroke="#d4d4d8"/><text x="455" y="31.5" text-anchor="middle" font-size="12" fill="#27272a">You cash out on</text><text x="455" y="46.5" text-anchor="middle" font-size="12" fill="#27272a">request</text><line x1="534" y1="35" x2="562" y2="35" stroke="#a1a1aa" stroke-width="1.5" marker-end="url(#sxf_arrow)"/><rect x="566" y="8" width="150" height="54" rx="6" fill="#CD4C00" stroke="#CD4C00"/><text x="641" y="31.5" text-anchor="middle" font-size="12" fill="#ffffff">The payout reaches</text><text x="641" y="46.5" text-anchor="middle" font-size="12" fill="#ffffff">your bank</text></svg>