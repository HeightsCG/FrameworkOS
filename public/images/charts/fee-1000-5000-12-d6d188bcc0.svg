ium ($35/mo, 0% on sales) $5,000; Beacons Free (9% seller fee) $4,550; Beacons Creator Plus ($30/mo, 0% seller fee) $5,000; Stan Store Creator ($29/mo, no transaction fee) $5,000.</desc></svg>