<?xml version="1.0" encoding="UTF-8"?>
<svg class="sx-chart" viewBox="0 0 448 260" width="448" height="260" role="img" aria-labelledby="sxc_t sxc_d" xmlns="http://www.w3.org/2000/svg" style="font-family:Inter,Helvetica,Arial,sans-serif"><title id="sxc_t">What you keep after the platform fee and plan price</title><line x1="64" y1="155" x2="432" y2="155" stroke="#e4e4e7" stroke-width="1"/><text x="56" y="159" text-anchor="end" font-size="11" fill="#71717a">$1,250</text><line x1="64" y1="110" x2="432" y2="110" stroke="#e4e4e7" stroke-width="1"/><text x="56" y="114" text-anchor="end" font-size="11" fill="#71717a">$2,500</text><line x1="64" y1="65" x2="432" y2="65" stroke="#e4e4e7" stroke-width="1"/><text x="56" y="69" text-anchor="end" font-size="11" fill="#71717a">$3,700</text><line x1="64" y1="20" x2="432" y2="20" stroke="#e4e4e7" stroke-width="1"/><text x="56" y="24" text-anchor="end" font-size="11" fill="#71717a">$4,950</text><line x1="64" y1="200" x2="432" y2="200" stroke="#a1a1aa" stroke-width="1"/><rect x="84" y="169.1" width="28" height="30.9" fill="#CD4C00" rx="3"><title>Creator Link Studio Creator (10% + $49/mo): you keep $851 of $1,000</title></rect><text x="98" y="165.1" text-anchor="middle" font-size="10" fill="#27272a">$851</text><rect x="120" y="172" width="28" height="28" fill="#FF6A13" rx="3"><title>Creator Link Studio Studio (3% + $199/mo): you keep $771 of $1,000</title></rect><text x="134" y="168" text-anchor="middle" font-size="10" fill="#27272a">$771</text><rect x="156" y="168.1" width="28" height="31.9" fill="#d4d4d8" rx="3"><title>Linktree Free (12% on sales): you keep $880 of $1,000</title></rect><text x="170" y="164.1" text-anchor="middle" font-size="10" fill="#27272a">$880</text><rect x="192" y="165" width="28" height="35" fill="#e4e4e7" rx="3"><title>Linktree Premium ($35/mo, 0% on sales): you keep $965 of $1,000</title></rect><text x="206" y="161" text-anchor="middle" font-size="10" fill="#27272a">$965</text><text x="152" y="218" text-anchor="middle" font-size="12" fill="#27272a">on $1,000 of sales</text><rect x="268" y="38.6" width="28" height="161.4" fill="#CD4C00" rx="3"><title>Creator Link Studio Creator (10% + $49/mo): you keep $4,451 of $5,000</title></rect><text x="282" y="34.6" text-anchor="middle" font-size="10" fill="#27272a">$4,451</text><rect x="304" y="31.4" width="28" height="168.6" fill="#FF6A13" rx="3"><title>Creator Link Studio Studio (3% + $199/mo): you keep $4,651 of $5,000</title></rect><text x="318" y="27.4" text-anchor="middle" font-size="10" fill="#27272a">$4,651</text><rect x="340" y="40.5" width="28" height="159.5" fill="#d4d4d8" rx="3"><title>Linktree Free (12% on sales): you keep $4,400 of $5,000</title></rect><text x="354" y="36.5" text-anchor="middle" font-size="10" fill="#27272a">$4,400</text><rect x="376" y="20" width="28" height="180" fill="#e4e4e7" rx="3"><title>Linktree Premium ($35/mo, 0% on sales): you keep $4,965 of $5,000</title></rect><text x="390" y="16" text-anchor="middle" font-size="10" fill="#27272a">$4,965</text><text x="336" y="218" text-anchor="middle" font-size="12" fill="#27272a">on $5,000 of sales</text><desc id="sxc_d">On $1,000 of sales you keep: Creator Link Studio Creator (10% + $49/mo) $851; Creator Link Studio Studio (3% + $199/mo) $771; Linktree Free (12% on sales) $880; Linktree Premium ($35/mo, 0% on sales) $965. On $5,000 of sales you keep: Creator Link Studio Creator (10% + $49/mo) $4,451; Creator Link Studio Studio (3% + $199/mo) $4,651; Linktree Free (12% on sales) $4,400; Linktree Premium ($35/mo, 0% on sales) $4,965.</desc></svg>