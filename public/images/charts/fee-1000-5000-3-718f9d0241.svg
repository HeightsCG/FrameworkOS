<?xml version="1.0" encoding="UTF-8"?>
<svg class="sx-chart" viewBox="0 0 376 260" width="376" height="260" role="img" aria-labelledby="sxc_t sxc_d" xmlns="http://www.w3.org/2000/svg" style="font-family:Inter,Helvetica,Arial,sans-serif"><title id="sxc_t">What you keep after the platform fee and plan price</title><line x1="64" y1="155" x2="360" y2="155" stroke="#e4e4e7" stroke-width="1"/><text x="56" y="159" text-anchor="end" font-size="11" fill="#71717a">$1,150</text><line x1="64" y1="110" x2="360" y2="110" stroke="#e4e4e7" stroke-width="1"/><text x="56" y="114" text-anchor="end" font-size="11" fill="#71717a">$2,350</text><line x1="64" y1="65" x2="360" y2="65" stroke="#e4e4e7" stroke-width="1"/><text x="56" y="69" text-anchor="end" font-size="11" fill="#71717a">$3,500</text><line x1="64" y1="20" x2="360" y2="20" stroke="#e4e4e7" stroke-width="1"/><text x="56" y="24" text-anchor="end" font-size="11" fill="#71717a">$4,650</text><line x1="64" y1="200" x2="360" y2="200" stroke="#a1a1aa" stroke-width="1"/><rect x="84" y="167.1" width="28" height="32.9" fill="#CD4C00" rx="3"><title>Creator Link Studio Creator (10% + $49/mo): you keep $851 of $1,000</title></rect><text x="98" y="163.1" text-anchor="middle" font-size="10" fill="#27272a">$851</text><rect x="120" y="170.2" width="28" height="29.8" fill="#FF6A13" rx="3"><title>Creator Link Studio Studio (3% + $199/mo): you keep $771 of $1,000</title></rect><text x="134" y="166.2" text-anchor="middle" font-size="10" fill="#27272a">$771</text><rect x="156" y="169" width="28" height="31" fill="#d4d4d8" rx="3"><title>Fanvue: you keep $800 of $1,000</title></rect><text x="170" y="165" text-anchor="middle" font-size="10" fill="#27272a">$800</text><text x="134" y="218" text-anchor="middle" font-size="12" fill="#27272a">on $1,000 of sales</text><rect x="232" y="27.7" width="28" height="172.3" fill="#CD4C00" rx="3"><title>Creator Link Studio Creator (10% + $49/mo): you keep $4,451 of $5,000</title></rect><text x="246" y="23.7" text-anchor="middle" font-size="10" fill="#27272a">$4,451</text><rect x="268" y="20" width="28" height="180" fill="#FF6A13" rx="3"><title>Creator Link Studio Studio (3% + $199/mo): you keep $4,651 of $5,000</title></rect><text x="282" y="16" text-anchor="middle" font-size="10" fill="#27272a">$4,651</text><rect x="304" y="45.2" width="28" height="154.8" fill="#d4d4d8" rx="3"><title>Fanvue: you keep $4,000 of $5,000</title></rect><text x="318" y="41.2" text-anchor="middle" font-size="10" fill="#27272a">$4,000</text><text x="282" y="218" text-anchor="middle" font-size="12" fill="#27272a">on $5,000 of sales</text><desc id="sxc_d">On $1,000 of sales you keep: Creator Link Studio Creator (10% + $49/mo) $851; Creator Link Studio Studio (3% + $199/mo) $771; Fanvue $800. On $5,000 of sales you keep: Creator Link Studio Creator (10% + $49/mo) $4,451; Creator Link Studio Studio (3% + $199/mo) $4,651; Fanvue $4,000.</desc></svg>