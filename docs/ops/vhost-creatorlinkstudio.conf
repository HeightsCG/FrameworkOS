# REFERENCE ONLY, DO NOT APPLY (closed 2026-10-08: vhost frozen, .htaccess off limits, ALB shared by several apps).
# Creator Link Studio: security headers and redirects for the PRODUCTION Apache vhost.
# Source: docs/seo-audit-2026-10-08/technical-seo.md (P1 headers, P1 redirect chain, P1 /index.php, P2 /compare)
#         and docs/seo-audit-2026-10-08/growth-and-production.md section 4.
#
# Nothing here is applied automatically. Daniel applies it by hand on the prod box only, never on dev.
#
# HOW TO APPLY (Ubuntu, Apache 2.4)
#   1. sudo cp vhost-creatorlinkstudio.conf /etc/apache2/conf-available/cls-vhost.conf
#   2. Inside the <VirtualHost> that serves www.creatorlinkstudio.com (the :80 one when TLS ends at the load
#      balancer, the :443 one when Apache holds the certificate) add one line:
#          Include /etc/apache2/conf-available/cls-vhost.conf
#   3. sudo a2enmod headers rewrite          (both are already on if the site's .htaccess works; harmless)
#   4. sudo apache2ctl configtest            (must print "Syntax OK"; if not, remove the Include and stop)
#   5. sudo systemctl reload apache2         (reload, not restart: open connections finish)
#   6. Check from outside:
#          curl -sI https://www.creatorlinkstudio.com/ | grep -iE 'strict-transport|x-content-type|referrer-policy|x-frame'
#          curl -sI http://creatorlinkstudio.com/          -> one 301 to https://www.creatorlinkstudio.com/ (no :443)
#          curl -sI https://www.creatorlinkstudio.com/index.php/pricing -> 301 to /pricing
#          curl -sI https://www.creatorlinkstudio.com/compare          -> 301 to /best-creator-monetization-platforms
#          curl -s  https://www.creatorlinkstudio.com/health          -> {"ok":true,...}
#   Roll back: delete the Include line, apache2ctl configtest, systemctl reload apache2.
#
# X-FRAME-OPTIONS (sent twice today: "SAMEORIGIN, SAMEORIGIN")
#   public/.htaccess line 11 reads, verbatim:
#          Header always append X-Frame-Options SAMEORIGIN
#   Change "append" to "set" on that line:
#          Header always set X-Frame-Options SAMEORIGIN
#   The repo root .htaccess line 11 has the same "append" line. When prod's DocumentRoot is .../www/public, Apache
#   applies the root file first and public/.htaccess last, so "set" in public/.htaccess alone leaves one header.
#   When the DocumentRoot is .../www itself, public/.htaccess may not be in play: change the root .htaccess line 11
#   to "set" as well (or instead). Check with: grep -i DocumentRoot /etc/apache2/sites-enabled/*.conf
#   This file deliberately does not set X-Frame-Options, because the .htaccess value would be added after it.

<IfModule mod_headers.c>
    # HSTS: browsers go straight to https for a year, on every subdomain (www, gateway). No "preload" on purpose.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>

<IfModule mod_rewrite.c>
    RewriteEngine On

    # Single-hop canonical redirect: http://creatorlinkstudio.com, https://creatorlinkstudio.com and
    # http://www.creatorlinkstudio.com all go to https://www.creatorlinkstudio.com<path> in ONE 301, with no ":443".
    # Only the two platform hosts are touched: creators' custom domains (through the Caddy gateway), the gateway
    # itself and the load balancer's health check (Host = an IP) pass through unchanged.
    #
    # TLS ends at the AWS load balancer, so Apache sees plain http and the original scheme is X-Forwarded-Proto.
    # The ":443" in today's Location headers comes from the load balancer's own HTTP:80 listener rule
    # ("Redirect to HTTPS", which always writes the port). Once this file is live, switch that listener's default
    # action from "Redirect" to "Forward to <target group>" so Apache does the single hop below.
    RewriteCond %{HTTP_HOST} ^(www\.)?creatorlinkstudio\.com$ [NC]
    RewriteCond %{HTTP:X-Forwarded-Proto} =http [OR]
    RewriteCond %{HTTP_HOST} ^creatorlinkstudio\.com$ [NC]
    RewriteRule ^/?(.*)$ https://www.creatorlinkstudio.com/$1 [R=301,L]
    # If Apache terminates TLS itself (no load balancer), use this pair instead of the X-Forwarded-Proto line:
    #   RewriteCond %{HTTPS} off [OR]
    #   RewriteCond %{HTTP_HOST} ^creatorlinkstudio\.com$ [NC]

    # /index.php and /index.php/<path> are duplicate copies of the home page: 301 to / or to /<path>.
    # Matched on THE_REQUEST (the browser's request line) so the app's own internal rewrite to index.php?url=...
    # is never redirected (platform hosts only). QSD drops the query string (index.php?url=x is not a public URL).
    RewriteCond %{HTTP_HOST} ^(www\.)?creatorlinkstudio\.com$ [NC]
    RewriteCond %{THE_REQUEST} \s/+index\.php/+([^\s?]+) [NC]
    RewriteRule ^ https://www.creatorlinkstudio.com/%1 [R=301,L,NE,QSD]
    RewriteCond %{HTTP_HOST} ^(www\.)?creatorlinkstudio\.com$ [NC]
    RewriteCond %{THE_REQUEST} \s/+index\.php[\s?] [NC]
    RewriteRule ^ https://www.creatorlinkstudio.com/ [R=301,L,QSD]

    # /compare (the hub) 404s: send it to the best-of page. /compare/<name> pages are unchanged.
    RewriteCond %{HTTP_HOST} ^(www\.)?creatorlinkstudio\.com$ [NC]
    RewriteRule ^/?compare/?$ https://www.creatorlinkstudio.com/best-creator-monetization-platforms [R=301,L]
</IfModule>
